version: "3.8"

services:
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - restaurant-network

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_HEAP_OPTS=-Xmx512M -Xms256M
    networks:
      - restaurant-network

  frontend:
    build: ./services/frontend
    ports:
      - "5173:5173"
    depends_on:
      - restaurant-manager
    networks:
      - restaurant-network
    volumes:
      - ./services/frontend:/app
      - /app/node_modules

  restaurant-manager:
    build: ./services/restaurant-manager
    ports:
      - "3004:3004"
      - "8082:8082" # WebSocket
      - "8083:8083"
    depends_on:
      - kafka
      - mongodb
    networks:
      - restaurant-network
    environment:
      - KAFKA_BROKER=kafka:9092
      - MONGODB_URI=mongodb://mongodb:27017/restaurantDB
    volumes:
      - ./shared:/app/shared

  kitchen-service:
    build: ./services/kitchen-service
    ports:
      - "3002:3002"
    depends_on:
      - kafka
      - mongodb
    networks:
      - restaurant-network
    environment:
      - KAFKA_BROKER=kafka:9092
      - MONGODB_URI=mongodb://mongodb:27017/restaurantDB
    volumes:
      - ./shared:/app/shared

  warehouse-service:
    build: ./services/warehouse-service
    ports:
      - "3003:3003"
      - "8084:8084"
      - "8085:8085"
    depends_on:
      - kafka
      - mongodb
    networks:
      - restaurant-network
    environment:
      - KAFKA_BROKER=kafka:9092
      - MONGODB_URI=mongodb://mongodb:27017/restaurantDB
    volumes:
      - ./shared:/app/shared

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    networks:
      - restaurant-network
    volumes:
      - mongodb_data:/data/db

networks:
  restaurant-network:
    driver: bridge

volumes:
  mongodb_data:

version: "3.8"

services:
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper
    restart: on-failure
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    restart: always
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_HEAP_OPTS=-Xmx512M -Xms256M
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build: ./services/frontend
    restart: on-failure
    ports:
      - "5173:5173"
    depends_on:
      - restaurant-manager
    networks:
      - restaurant-network
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  restaurant-manager:
    build: ./services/restaurant-manager
    restart: on-failure
    ports:
      - "3004:3004"
      - "8082:8082" # WebSocket
      - "8083:8083"
    depends_on:
      - kafka
      - mongodb
    networks:
      - restaurant-network
    environment:
      - KAFKA_BROKER=kafka:9092
      - MONGODB_URI=mongodb://mongodb:27017/restaurantDB
    volumes:
      - ./shared:/app/shared
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/order/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s

  kitchen-service:
    build: ./services/kitchen-service
    restart: on-failure
    ports:
      - "3002:3002"
    depends_on:
      - kafka
      - mongodb
    networks:
      - restaurant-network
    environment:
      - KAFKA_BROKER=kafka:9092
      - MONGODB_URI=mongodb://mongodb:27017/restaurantDB
    volumes:
      - ./shared:/app/shared
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/prepare/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s

  warehouse-service:
    build: ./services/warehouse-service
    restart: on-failure
    ports:
      - "3003:3003"
      - "8084:8084"
      - "8085:8085"
    depends_on:
      - kafka
      - mongodb
    networks:
      - restaurant-network
    environment:
      - KAFKA_BROKER=kafka:9092
      - MONGODB_URI=mongodb://mongodb:27017/restaurantDB
    volumes:
      - ./shared:/app/shared
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/supply/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    networks:
      - restaurant-network
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "27017"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  restaurant-network:
    driver: bridge

volumes:
  mongodb_data:
